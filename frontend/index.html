<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Auth Section -->
    <div id="auth-container">
        <h1>Todo App</h1>

        <div id="auth-forms">
            <!-- Login Form -->
            <div id="login-form">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="login()">Login</button>
                <p>Don't have an account? <span onclick="showRegister()">Register</span></p>
            </div>

            <!-- Register Form -->
            <div id="register-form" style="display:none;">
                <h2>Register</h2>
                <input type="email" id="register-email" placeholder="Email">
                <input type="password" id="register-password" placeholder="Password">
                <button onclick="register()">Register</button>
                <p>Already have an account? <span onclick="showLogin()">Login</span></p>
            </div>
        </div>

        <p id="auth-message"></p>
    </div>

    <!-- Todo Section -->
    <div id="todo-container" style="display:none;">
        <div id="todo-header">
            <h1>My Todos</h1>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- Add Todo -->
        <div id="add-todo">
            <input type="text" id="todo-title" placeholder="Todo title">
            <input type="text" id="todo-description" placeholder="Description (optional)">
            <button onclick="createTodo()">Add Todo</button>
        </div>

        <p id="todo-message"></p>

        <!-- Todo List -->
        <div id="todo-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
